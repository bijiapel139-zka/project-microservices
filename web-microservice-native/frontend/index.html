<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard E-Commerce Mikroservis</title>
    <!-- Sambungin ke file baju (CSS) -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🛒 Aplikasi E-Commerce (Arsitektur Mikroservis Native)</h1>
    </header>

    <div class="grid">
        <!-- SEKTOR 1: Profil Pengguna (Port 5001) -->
        <div class="card">
            <h2>👤 Profil Pengguna</h2>
            <div id="user-info">Memuat data pengguna...</div>
            <br>
            <label for="pilih-akun"><strong>Ganti Akun Pelanggan:</strong></label>
            <select id="pilih-akun" onchange="gantiAkun(this.value)">
                <option value="1">Budi Santoso (ID: 1)</option>
                <option value="2">Siti Aminah (ID: 2)</option>
                <option value="3">Andi Wijaya (ID: 3)</option>
                <option value="4">Dewi Sartika (ID: 4)</option>
            </select>
        </div>

        <!-- SEKTOR 2: Keranjang Belanja (Port 5001) -->
        <div class="card">
            <h2>🛒 Produk Pilihan (Keranjang)</h2>
            <div id="cart-list">Keranjang kosong.</div>
            <div id="total-harga" class="total-section">Total: Rp 0</div>
            <button class="btn btn-success" onclick="prosesCheckout()">Check Out Sekarang</button>
        </div>

        <!-- SEKTOR 3: Daftar Produk & Fitur Tambah Produk (Port 5002) -->
        <div class="card">
            <h2>📦 Produk Tersedia</h2>

            <!-- FORMULIR INPUT PRODUK BARU -->
            <div class="form-tambah">
                <h3>➕ Tambah Produk ke Toko</h3>
                <label>Nama Produk:</label>
                <input type="text" id="input-nama-produk" placeholder="Contoh: Keyboard Mechanical">

                <label>Harga Produk (Rp):</label>
                <input type="number" id="input-harga-produk" placeholder="Contoh: 450000">

                <button class="btn" onclick="tambahProdukKeToko()">Masukkan ke Daftar Toko</button>
            </div>

            <div id="product-list">Memuat daftar produk...</div>
        </div>
    </div>

    <!-- SEKTOR 4: Riwayat Pesanan (data dari User Service, Port 5001) -->
    <div class="card" style="margin-top: 20px;">
        <h2>🧾 Riwayat Pesanan</h2>
        <div id="riwayat-list">Memuat riwayat...</div>
    </div>

    <!-- Sambungin ke file kurir (JavaScript). Wajib di PALING BAWAH,
         supaya elemen di atas sudah ada sebelum script jalan. -->
    <script src="script.js"></script>
</body>

</html>
